<main class="page not-found-page">
  <div class="page-shell">
    <section class="page-section">
      <div class="card-surface card-padding not-found-card">
        <div class="not-found-card__icon" aria-hidden="true">
          <i class="bi bi-compass"></i>
        </div>

        <h1 class="not-found-card__title">Page not found</h1>

        <p class="not-found-card__text">
          That link doesn’t exist (or it moved). If you got here from an old bookmark, grab the new
          link from Home, Guides, or Tools.
        </p>

        @if (attemptedUrl) {
          <p class="not-found-card__path">
            Attempted URL: <code>{{ attemptedUrl }}</code>
          </p>
        }

        <div class="not-found-card__actions">
          <a class="btn-primary" routerLink="/home">
            <i class="bi bi-house-door-fill"></i>
            Home
          </a>

          <a class="btn-secondary" routerLink="/guides">
            <i class="bi bi-journal-text"></i>
            Guides
          </a>

          <a class="btn-secondary" routerLink="/tools">
            <i class="bi bi-wrench-adjustable"></i>
            Tools
          </a>

          <button type="button" class="btn-ghost" (click)="goBack()">
            <i class="bi bi-arrow-left"></i>
            Back
          </button>
        </div>
      </div>
    </section>
  </div>
</main>
